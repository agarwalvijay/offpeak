name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Avoid overlapping deploys
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build PWA
        # OFFPEAK_MARKETS (repo variable, e.g. "comed,pjm,caiso") restricts the
        # markets the UI offers. Unset → all markets. Baked into the bundle at
        # build, so changing it needs a re-run of this workflow.
        env:
          VITE_OFFPEAK_MARKETS: ${{ vars.OFFPEAK_MARKETS }}
        run: |
          npm ci
          npm run build

      # Until the SSH_* secrets + server are set up, validate the build in CI
      # but skip the deploy (so the workflow stays green).
      - name: Check deploy secrets
        id: guard
        run: |
          if [ -n "${{ secrets.SSH_HOST }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SSH secrets not configured yet — built successfully, skipping deploy."
          fi

      - name: Set up SSH
        if: steps.guard.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          PORT="${{ secrets.SSH_PORT }}"; PORT="${PORT:-22}"
          ssh-keyscan -p "$PORT" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync build to server
        if: steps.guard.outputs.ready == 'true'
        run: |
          PORT="${{ secrets.SSH_PORT }}"; PORT="${PORT:-22}"
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude '.claude' \
            --exclude 'legacy' \
            --exclude 'mobile' \
            --exclude 'src' \
            --exclude 'public' \
            --exclude '/index.html' \
            --exclude '/tsconfig*' \
            --exclude '/vite.config.ts' \
            --exclude '/.env' \
            --exclude '*.log' \
            -e "ssh -i ~/.ssh/id_deploy -p $PORT -o StrictHostKeyChecking=yes" \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/"

      # Push provider secrets (ERCOT) into a server-side .env that server.js
      # loads — kept out of git and the client bundle. Uses env mapping +
      # printf %s so values can't break out of the shell.
      - name: Write server env
        if: steps.guard.outputs.ready == 'true'
        env:
          ERCOT_USERNAME: ${{ secrets.ERCOT_USERNAME }}
          ERCOT_PASSWORD: ${{ secrets.ERCOT_PASSWORD }}
          ERCOT_SUBSCRIPTION_KEY: ${{ secrets.ERCOT_SUBSCRIPTION_KEY }}
          ISONE_USERNAME: ${{ secrets.ISONE_USERNAME }}
          ISONE_PASSWORD: ${{ secrets.ISONE_PASSWORD }}
          PJM_SUBSCRIPTION_KEY: ${{ secrets.PJM_SUBSCRIPTION_KEY }}
          OFFPEAK_MARKETS: ${{ vars.OFFPEAK_MARKETS }}
        run: |
          umask 077
          {
            printf 'ERCOT_USERNAME=%s\n' "$ERCOT_USERNAME"
            printf 'ERCOT_PASSWORD=%s\n' "$ERCOT_PASSWORD"
            printf 'ERCOT_SUBSCRIPTION_KEY=%s\n' "$ERCOT_SUBSCRIPTION_KEY"
            printf 'ISONE_USERNAME=%s\n' "$ISONE_USERNAME"
            printf 'ISONE_PASSWORD=%s\n' "$ISONE_PASSWORD"
            printf 'PJM_SUBSCRIPTION_KEY=%s\n' "$PJM_SUBSCRIPTION_KEY"
            printf 'OFFPEAK_MARKETS=%s\n' "$OFFPEAK_MARKETS"
          } > server.env
          PORT="${{ secrets.SSH_PORT }}"; PORT="${PORT:-22}"
          scp -i ~/.ssh/id_deploy -P "$PORT" -o StrictHostKeyChecking=yes \
            server.env "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/.env"
          rm -f server.env

      - name: Reload pm2
        if: steps.guard.outputs.ready == 'true'
        run: |
          PORT="${{ secrets.SSH_PORT }}"; PORT="${PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -lc '
              set -e
              export NVM_DIR="$HOME/.nvm"
              [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
              cd "${{ secrets.DEPLOY_PATH }}"
              pm2 reload ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs
              pm2 save
            '
