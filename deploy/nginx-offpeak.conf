# nginx vhost for OffPeak — proxies offpeak.atsumilabs.com to the pm2 app
# (server.js) on 127.0.0.1:8127. Install:
#
#   sudo cp deploy/nginx-offpeak.conf /etc/nginx/sites-available/offpeak
#   sudo ln -sf /etc/nginx/sites-available/offpeak /etc/nginx/sites-enabled/offpeak
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d offpeak.atsumilabs.com   # adds the 443 block + redirect
#
server {
    listen 80;
    listen [::]:80;
    server_name offpeak.atsumilabs.com;

    location / {
        proxy_pass http://127.0.0.1:8127;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
