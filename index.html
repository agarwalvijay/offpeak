<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1220" />
    <meta
      name="description"
      content="Real-time ComEd hourly electricity pricing, trends, and price alerts."
    />
    <title>OffPeak — ComEd Hourly Pricing</title>
    <script>
      // Apply the saved theme before paint to avoid a flash.
      (function () {
        try {
          var raw = localStorage.getItem("offpeak-settings");
          var t = raw ? JSON.parse(raw).state.theme : "system";
          var dark =
            t === "dark" ||
            (t !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute(
            "data-theme",
            dark ? "dark" : "light",
          );
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
